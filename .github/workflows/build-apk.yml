name: Build APK
on:
  workflow_dispatch: {}      # Actions tab -> Build APK -> Run workflow
  push:
    tags: ['v*']              # or push a tag like v1.0
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Locate the project (repo contents, or an uploaded Mail-Android-Project.zip)
        run: |
          if [ -d android ] && [ -f CMakeLists.txt ]; then PROJ=.
          elif [ -f Mail-Android-Project.zip ]; then unzip -q -o Mail-Android-Project.zip; PROJ=poct
          else echo "::error::Upload Mail-Android-Project.zip to the repository root first, then run this workflow again."; exit 1; fi
          test -d "$PROJ/android" || { echo "::error::android/ folder not found in $PROJ"; exit 1; }
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - name: Keep the app UI in sync with ui/index.html
        run: cp "$PROJ/ui/index.html" "$PROJ/android/app/src/main/assets/ui/index.html"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Install Android SDK parts (API 36, NDK r28, CMake)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.12433566" "cmake;3.22.1"
      - name: Use your own signing key (optional; keeps app updates installable)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KKP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            { echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks"; echo "SIGNING_STORE_PASSWORD=$KSP"; echo "SIGNING_KEY_ALIAS=${KA:-mail}"; echo "SIGNING_KEY_PASSWORD=${KKP:-$KSP}"; } >> "$GITHUB_ENV"
          else echo "No signing secrets set: using the key inside the project if present, otherwise a temporary debug key."; fi
      - name: Build release APK
        working-directory: ${{ env.PROJ }}/android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Collect APK
        run: |
          mkdir -p out && cp "$PROJ"/android/app/build/outputs/apk/release/*.apk out/Mail.apk && ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: Mail-APK, path: out/Mail.apk }
      - name: Publish a GitHub Release with Mail.apk (direct download, no unzipping)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mail APK build ${{ github.run_number }}
          files: out/Mail.apk
      - name: Show why the build failed (read the Summary page of this run)
        if: failure()
        run: |
          f="$GITHUB_WORKSPACE/build.log"
          {
            echo "### Why the build failed"
            echo '```'
            if [ -f "$f" ]; then grep -n -m1 -A25 "What went wrong" "$f" || tail -n 40 "$f"; else echo "(no build log: the failure happened before Gradle started)"; fi
            echo '```'
            echo "### CMake / compiler errors"
            echo '```'
            ( grep -rhE "CMake Error|error:|fatal error|undefined reference" -A4 "$PROJ"/android/app/.cxx --include=*.log 2>/dev/null
              [ -f "$f" ] && grep -E "CMake Error|error:|fatal error|undefined reference" -A4 "$f" ) | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f "$f" ] && echo "::error title=Build failed::$(grep -m1 -A12 'What went wrong' "$f" | tr '\n' '|')" || true
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            ${{ env.PROJ }}/android/app/.cxx/**/*.log
            ${{ env.PROJ }}/android/app/build/reports/**
          if-no-files-found: ignore
